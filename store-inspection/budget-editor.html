<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>预算录入</title>
    <link rel="stylesheet" href="../workbench.css" />
    <style>
      body { background: #eef2f5; }
      .page { max-width: 1180px; margin: 0 auto; padding: 24px; }
      .budget-form { display: grid; gap: 8px; margin-top: 14px; }
      .budget-line {
        min-height: 64px;
        padding: 12px;
        border: 1px solid #d9e1ea;
        border-radius: 8px;
        background: #fff;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 120px 120px 120px 120px;
        gap: 10px;
        align-items: center;
      }
      .budget-line strong { font-size: 14px; }
      .budget-line span { color: #637083; font-size: 12px; }
      .budget-line label { display: grid; gap: 4px; color: #637083; font-size: 12px; font-weight: 800; }
      .budget-line input {
        width: 100%;
        height: 36px;
        border: 1px solid #d9e1ea;
        border-radius: 7px;
        padding: 0 9px;
        font: inherit;
      }
      .save-status {
        display: none;
        margin: 12px 0;
        padding: 14px 16px;
        border-radius: 8px;
        border: 1px solid #d9e1ea;
        background: #fff;
      }
      .save-status strong { display: block; font-size: 16px; margin-bottom: 4px; }
      .save-status span { color: #637083; font-size: 13px; }
      .save-status.success {
        display: block;
        border-color: #8fd3b3;
        background: #effaf5;
        color: #137463;
      }
      .save-status.error {
        display: block;
        border-color: #efaaa5;
        background: #fff3f2;
        color: #b42318;
      }
      .save-status.pending {
        display: block;
        border-color: #c4d3e3;
        background: #f7fafc;
        color: #364152;
      }
      .primary-action.saved {
        background: #137463;
        color: #fff;
      }
      textarea {
        width: 100%;
        min-height: 180px;
        margin-top: 12px;
        border: 1px solid #d9e1ea;
        border-radius: 8px;
        padding: 12px;
        font: 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      @media (max-width: 900px) {
        .page { padding: 16px; }
        .budget-line { grid-template-columns: 1fr 1fr; }
        .budget-line .store-cell { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <p class="kicker" id="generatedAt">预算配置</p>
          <h1>预算录入</h1>
        </div>
        <div class="top-actions">
          <a class="ghost-action" href="../index.html">返回总看板</a>
          <button class="primary-action" id="saveBtn" type="button">保存到云端</button>
        </div>
      </header>
      <div id="saveStatus" class="save-status" role="status" aria-live="polite"></div>
      <section class="module">
        <div class="module-head">
          <div>
            <p>按平台填写</p>
            <h2>饿了么和美团预算</h2>
          </div>
          <span class="tag ready">配置</span>
        </div>
        <div class="budget-form" id="budgetForm"></div>
        <div id="saveMessage" class="empty-line"></div>
        <textarea id="configText" spellcheck="false"></textarea>
      </section>
    </main>
    <script src="../outputs/promo_budget_preview/latest-data.js"></script>
    <script>
      const preview = window.PROMO_BUDGET_PREVIEW || {};
      const apiUrl = "http://139.155.148.169/api/promo-budget-overrides?token=xiongxiaoxiao-order";
      const rows = preview.eleme_lunch || [];
      const elemeDinner = new Map((preview.eleme_dinner || []).map((item) => [item.store, item]));
      const meituanLunch = new Map((preview.meituan_lunch || []).map((item) => [item.sourceStore || item.store, item]));
      const meituanDinner = new Map((preview.meituan_dinner || []).map((item) => [item.sourceStore || item.store, item]));
      let saved = JSON.parse(localStorage.getItem("promo-budget-overrides") || "{}");
      const form = document.querySelector("#budgetForm");
      const configText = document.querySelector("#configText");
      const saveMessage = document.querySelector("#saveMessage");
      const saveStatus = document.querySelector("#saveStatus");
      const saveBtn = document.querySelector("#saveBtn");

      function filledStoreCount(payload) {
        return Object.values(payload.stores || {}).filter((store) => Object.keys(store || {}).length > 0).length;
      }

      function showStatus(type, title, detail) {
        saveStatus.className = `save-status ${type}`;
        saveStatus.innerHTML = `<strong>${title}</strong><span>${detail}</span>`;
        saveMessage.textContent = detail;
      }

      function platformConfig(name, platform) {
        const byStore = saved.stores?.[name] || {};
        return byStore[platform] || byStore.all || {};
      }

      function render() {
        form.innerHTML = rows.map((item) => {
          const elemeCfg = platformConfig(item.store, "饿了么");
          const meituanCfg = platformConfig(item.store, "美团");
          const dinnerItem = elemeDinner.get(item.store) || {};
          const meituanLunchItem = meituanLunch.get(item.store) || {};
          const meituanDinnerItem = meituanDinner.get(item.store) || {};
          return `
            <div class="budget-line" data-store="${item.store}">
              <div class="store-cell"><strong>${item.store}</strong><br><span>饿了么 / 美团分别填写</span></div>
              <label>饿了么午餐<input data-field="elemeLunchBudget" type="number" min="1" step="1" value="${elemeCfg.lunchBudget || item.targetBudget || ""}"></label>
              <label>饿了么晚餐<input data-field="elemeDinnerBudget" type="number" min="1" step="1" value="${elemeCfg.dinnerBudget || dinnerItem.targetBudget || ""}"></label>
              <label>美团午餐<input data-field="meituanLunchBudget" type="number" min="1" step="1" value="${meituanCfg.lunchBudget || meituanLunchItem.targetBudget || ""}"></label>
              <label>美团晚餐<input data-field="meituanDinnerBudget" type="number" min="1" step="1" value="${meituanCfg.dinnerBudget || meituanDinnerItem.targetBudget || ""}"></label>
            </div>
          `;
        }).join("");
        form.querySelectorAll("input").forEach((input) => input.addEventListener("input", updateConfig));
        updateConfig();
      }

      function updateConfig() {
        const stores = {};
        form.querySelectorAll(".budget-line").forEach((line) => {
          const store = line.dataset.store;
          const value = (field) => Number(line.querySelector(`[data-field="${field}"]`).value || 0);
          const elemeLunch = value("elemeLunchBudget");
          const elemeDinner = value("elemeDinnerBudget");
          const meituanLunch = value("meituanLunchBudget");
          const meituanDinner = value("meituanDinnerBudget");
          stores[store] = {};
          if (elemeLunch > 0 || elemeDinner > 0) {
            stores[store]["饿了么"] = {};
            if (elemeLunch > 0) stores[store]["饿了么"].lunchBudget = elemeLunch;
            if (elemeDinner > 0) stores[store]["饿了么"].dinnerBudget = elemeDinner;
          }
          if (meituanLunch > 0 || meituanDinner > 0) {
            stores[store]["美团"] = {};
            if (meituanLunch > 0) stores[store]["美团"].lunchBudget = meituanLunch;
            if (meituanDinner > 0) stores[store]["美团"].dinnerBudget = meituanDinner;
          }
        });
        const payload = { stores };
        localStorage.setItem("promo-budget-overrides", JSON.stringify(payload));
        configText.value = JSON.stringify(payload, null, 2);
      }

      saveBtn.addEventListener("click", async () => {
        saveBtn.disabled = true;
        saveBtn.textContent = "保存中...";
        saveBtn.classList.remove("saved");
        showStatus("pending", "正在保存", "正在把预算写入云端，请稍等。");
        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: configText.value,
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || "保存失败");
          saved = payload.data || JSON.parse(configText.value);
          localStorage.setItem("promo-budget-overrides", JSON.stringify(saved));
          const savedAt = new Date().toLocaleString("zh-CN", { hour12: false });
          saveBtn.textContent = "已保存";
          saveBtn.classList.add("saved");
          showStatus("success", "保存成功", `已保存 ${filledStoreCount(saved)} 家门店，时间：${savedAt}。上午和 17:30 自动化会读取这份预算。`);
        } catch (error) {
          saveBtn.textContent = "重新保存";
          showStatus("error", "保存失败", `${error.message || "没有保存成功"}。请检查网络后再点一次保存。`);
        } finally {
          saveBtn.disabled = false;
        }
      });

      document.querySelector("#generatedAt").textContent = `数据时间：${preview.generated_at || "-"}`;
      async function boot() {
        try {
          const response = await fetch(apiUrl);
          if (response.ok) {
            saved = await response.json();
            localStorage.setItem("promo-budget-overrides", JSON.stringify(saved));
          }
        } catch {}
        render();
      }
      boot();
    </script>
  </body>
</html>
