<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>美团预算初始化</title>
    <link rel="stylesheet" href="../workbench.css" />
    <style>
      body { background: #eef2f5; }
      .page { max-width: 1080px; margin: 0 auto; padding: 24px; }
      .budget-table { display: grid; gap: 8px; margin-top: 16px; }
      .budget-row {
        min-height: 58px;
        padding: 12px 14px;
        border: 1px solid #d9e1ea;
        border-radius: 8px;
        background: #fff;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 110px 110px;
        gap: 12px;
        align-items: center;
      }
      .budget-row span { color: #637083; font-size: 13px; }
      .budget-row strong { font-size: 15px; }
      .budget-row em { font-style: normal; color: #137463; font-weight: 900; }
      @media (max-width: 760px) {
        .page { padding: 16px; }
        .budget-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <p class="kicker" id="generatedAt">等待数据</p>
          <h1>美团预算初始化</h1>
        </div>
        <div class="top-actions">
          <a class="ghost-action" href="../index.html">返回总看板</a>
          <a class="primary-action" href="../outputs/promo_budget_preview/latest.json">预算数据</a>
        </div>
      </header>
      <section class="metrics">
        <article>
          <span>美团门店</span>
          <strong id="storeCount">-</strong>
          <em>午餐自动执行</em>
        </article>
        <article>
          <span>午餐预算合计</span>
          <strong id="budgetTotal">-</strong>
          <em>午餐初始预算</em>
        </article>
        <article>
          <span>晚餐门店</span>
          <strong id="dinnerStoreCount">-</strong>
          <em>17:30 自动执行</em>
        </article>
        <article>
          <span>晚餐预算合计</span>
          <strong id="dinnerBudgetTotal">-</strong>
          <em>晚餐初始预算</em>
        </article>
      </section>
      <section class="module">
        <div class="module-head">
          <div>
            <p>执行清单</p>
            <h2>点金推广 > 推广预算</h2>
          </div>
          <span class="tag ready">美团</span>
        </div>
        <div class="budget-table" id="budgetRows"></div>
      </section>
    </main>
    <script src="../outputs/promo_budget_preview/latest-data.js"></script>
    <script>
      const data = window.PROMO_BUDGET_PREVIEW || {};
      const rows = data.meituan_lunch || [];
      const dinnerRows = data.meituan_dinner || [];
      const yuan = (value) => `¥${Number(value || 0).toLocaleString("zh-CN", { maximumFractionDigits: 0 })}`;
      document.querySelector("#generatedAt").textContent = `预算预览：${data.generated_at || "-"}`;
      document.querySelector("#storeCount").textContent = `${rows.length} 家`;
      document.querySelector("#budgetTotal").textContent = yuan(rows.reduce((sum, item) => sum + Number(item.targetBudget || 0), 0));
      document.querySelector("#dinnerStoreCount").textContent = `${dinnerRows.length} 家`;
      document.querySelector("#dinnerBudgetTotal").textContent = yuan(dinnerRows.reduce((sum, item) => sum + Number(item.targetBudget || 0), 0));
      document.querySelector("#budgetRows").innerHTML = rows.length
        ? rows.map((item) => `
            <div class="budget-row">
              <div><strong>${item.store}</strong><br><span>搜索关键词：${item.keyword || "-"}</span></div>
              <em>${yuan(item.targetBudget)}</em>
              <span>${item.status === "auto" ? "自动执行" : "需确认"}</span>
            </div>
          `).join("")
        : '<div class="empty-line">暂无美团预算清单</div>';
    </script>
  </body>
</html>
