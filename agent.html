<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agent 手机入口</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --ink: #18202a;
        --muted: #697386;
        --line: #d9dee7;
        --panel: #ffffff;
        --accent: #0f766e;
        --danger: #b42318;
        --warn: #a15c07;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(760px, 100%);
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }

      header {
        padding: 10px 0 14px;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 13px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 14px 0;
      }

      .metric,
      .answer,
      .notice {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .metric {
        min-height: 74px;
        padding: 11px 10px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 5px;
        font-size: 24px;
        line-height: 1;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 12px 0;
      }

      .command-box {
        margin: 12px 0;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      input {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-size: 16px;
      }

      button {
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-size: 15px;
        text-align: center;
      }

      button.active {
        border-color: var(--accent);
        background: #e7f5f2;
        color: #0b4f49;
        font-weight: 700;
      }

      .answer {
        padding: 16px;
        min-height: 170px;
      }

      .answer h2 {
        margin: 0 0 10px;
        font-size: 17px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .answer p,
      .notice p {
        margin: 0;
        color: #2d3748;
        font-size: 16px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .notice {
        margin-top: 12px;
        padding: 12px;
        border-color: #c9d7d5;
        background: #f0faf8;
      }

      .footer {
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .error {
        color: var(--danger);
      }

      @media (max-width: 420px) {
        main {
          padding-left: 12px;
          padding-right: 12px;
        }

        h1 {
          font-size: 24px;
        }

        .summary {
          gap: 6px;
        }

        .metric {
          padding: 10px 8px;
        }

        .metric strong {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow" id="updatedAt">读取中</p>
        <h1>Agent 手机入口</h1>
      </header>

      <section class="summary" aria-label="Agent 概览">
        <div class="metric"><span>成功</span><strong id="agentSuccess">-</strong></div>
        <div class="metric"><span>失败</span><strong id="agentFailed">-</strong></div>
        <div class="metric"><span>关注</span><strong id="taskAttention">-</strong></div>
      </section>

      <section class="command-box" aria-label="对话命令">
        <input id="commandInput" type="text" placeholder="输入：今天哪里有问题？" autocomplete="off" />
        <button id="commandButton" type="button">询问</button>
      </section>

      <nav class="tabs" id="questionTabs" aria-label="常用问题"></nav>

      <section class="answer" aria-live="polite">
        <h2 id="answerTitle">等待数据</h2>
        <p id="answerText">正在读取最近一次 Mac mini agent 报告。</p>
      </section>

      <section class="notice">
        <p id="safetyText">手机入口只读，不执行真实动作。</p>
      </section>

      <p class="footer" id="sourceText"></p>
    </main>

    <script>
      const tabs = document.querySelector("#questionTabs");
      const answerTitle = document.querySelector("#answerTitle");
      const answerText = document.querySelector("#answerText");
      const commandInput = document.querySelector("#commandInput");
      const commandButton = document.querySelector("#commandButton");
      let agentPayload = null;

      function setText(id, value) {
        const el = document.querySelector(`#${id}`);
        if (el) el.textContent = value;
      }

      function renderAnswer(item, button) {
        [...tabs.querySelectorAll("button")].forEach((node) => node.classList.toggle("active", node === button));
        answerTitle.textContent = item.question;
        answerText.textContent = item.answer || "这项暂时没有回答。";
      }

      function normalizeCommand(value) {
        return String(value || "").trim().toLowerCase();
      }

      function answerCommand(value) {
        const raw = String(value || "").trim();
        if (!raw) return;
        const normalized = normalizeCommand(raw);
        const commands = Array.isArray(agentPayload?.commands) ? agentPayload.commands : [];
        const matched = commands.find((item) => normalizeCommand(item.text) === normalized);
        if (matched) {
          answerTitle.textContent = raw;
          answerText.textContent = matched.preview || "这条命令暂时没有预览。";
          return;
        }
        const answers = Array.isArray(agentPayload?.answers) ? agentPayload.answers : [];
        const byKeyword = answers.find((item) => {
          const text = `${item.question || ""} ${item.id || ""}`;
          return [...normalized].some(Boolean) && (
            (normalized.includes("问题") && item.id === "problems") ||
            (normalized.includes("补跑") && item.id === "rerun") ||
            (normalized.includes("执行") && item.id === "execution_agent") ||
            (normalized.includes("状态") && item.id === "status")
          );
        });
        answerTitle.textContent = raw;
        answerText.textContent = byKeyword
          ? byKeyword.answer
          : "手机页现在能回答常用状态问题。需要真正执行时，请在 Mac mini 上使用 agent_command.py；订货/下单/采购仍会被拦截。";
      }

      async function loadAgentStatus() {
        try {
          const response = await fetch("./outputs/agent_mobile/latest.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          agentPayload = payload;
          const summary = payload.summary || {};
          setText("updatedAt", `更新于 ${payload.generated_at || "未知时间"}`);
          setText("agentSuccess", summary.agent_success ?? "-");
          setText("agentFailed", summary.agent_failed ?? "-");
          setText("taskAttention", summary.task_attention ?? "-");
          setText("safetyText", payload.safety?.note || "手机入口只读，不执行真实动作。");
          setText("sourceText", `数据来自 ${payload.host || "Mac mini"}，最近 agent 运行：${summary.pipeline_generated_at || "未知"}`);

          tabs.innerHTML = "";
          const answers = Array.isArray(payload.answers) ? payload.answers : [];
          answers.forEach((item, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = item.question;
            button.addEventListener("click", () => renderAnswer(item, button));
            tabs.appendChild(button);
            if (index === 0) renderAnswer(item, button);
          });
          commandButton.addEventListener("click", () => answerCommand(commandInput.value));
          commandInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") answerCommand(commandInput.value);
          });
        } catch (error) {
          setText("updatedAt", "读取失败");
          answerTitle.textContent = "没有读到 Agent 数据";
          answerText.textContent = `请确认 Mac mini 已运行并发布 agent 状态。错误：${error.message}`;
          answerText.classList.add("error");
        }
      }

      loadAgentStatus();
    </script>
  </body>
</html>
