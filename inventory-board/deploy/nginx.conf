server {
    listen 80;
    server_name _;

    client_max_body_size 30m;

    location /business-report-dashboard/ {
        auth_basic "Xiong Operation";
        auth_basic_user_file /etc/nginx/.operation_workbench_htpasswd;
        alias /var/www/html/business-report-dashboard/;
        index index.html;
    }

    location = /operation-workbench/workbench-data.js {
        auth_basic "Xiong Operation";
        auth_basic_user_file /etc/nginx/.operation_workbench_htpasswd;
        alias /var/www/html/operation-workbench/workbench-data.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /operation-workbench/data/realtime-history.json {
        auth_basic "Xiong Operation";
        auth_basic_user_file /etc/nginx/.operation_workbench_htpasswd;
        alias /var/www/html/operation-workbench/data/realtime-history.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location /operation-workbench/ {
        auth_basic "Xiong Operation";
        auth_basic_user_file /etc/nginx/.operation_workbench_htpasswd;
        alias /var/www/html/operation-workbench/;
        index index.html;
    }

    location = /daily-order/admin {
        auth_basic "Xiong Operation";
        auth_basic_user_file /etc/nginx/.operation_workbench_htpasswd;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /daily-order/api/admin/ {
        auth_basic "Xiong Operation";
        auth_basic_user_file /etc/nginx/.operation_workbench_htpasswd;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /daily-order/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /order-submit {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /order-file/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/public-order/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/order/files/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_basic "Xiong Operation";
        auth_basic_user_file /etc/nginx/.operation_workbench_htpasswd;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
