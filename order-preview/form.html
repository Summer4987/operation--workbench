<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>门店填报页预览</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shot phone">
    <section class="phone-frame">
      <div class="phone-bar"><span>15:27</span><span>5G  91%</span></div>
      <div class="phone-title"><span class="back">‹</span>门店订货上报</div>
      <div class="form-body">
        <div class="notice">今日截止：16:00。提交后会自动进入采购汇总，你不用再在群里重复发明细。</div>
        <div class="field">
          <label>门店</label>
          <div class="select">金融街店</div>
        </div>
        <div class="field">
          <label>采购日期</label>
          <div class="input">2026-06-03</div>
        </div>
        <div class="field">
          <label>订货品项</label>
          <div class="item-line"><div class="select">鸡蛋 / 平台A</div><div class="input">30斤</div></div>
          <div class="item-line"><div class="select">生菜 / 平台B</div><div class="input">12斤</div></div>
          <div class="item-line"><div class="select">牛肉卷 / 平台C</div><div class="input">8包</div></div>
        </div>
        <div class="ghost-btn">+ 增加一项</div>
        <div class="field">
          <label>备注</label>
          <div class="textarea">生菜尽量要新鲜一点，晚到请提前说。</div>
        </div>
        <div class="submit-btn">提交订货</div>
      </div>
    </section>
  </main>
</body>
</html>
