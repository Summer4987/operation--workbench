<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>微信群订货通知预览</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shot phone">
    <section class="phone-frame">
      <div class="phone-bar"><span>15:20</span><span>5G  92%</span></div>
      <div class="phone-title"><span class="back">‹</span>五家门店订货群</div>
      <div class="chat-area">
        <div class="date-pill">6月3日 下午 15:20</div>
        <div class="message-row">
          <div class="avatar">采</div>
          <div class="bubble">
            <strong>今日订货开始上报</strong>
            各门店请在 <b>16:00 前</b> 填写今天需要采购的品项。微信里回复不算正式订单，以表单为准。
            <div class="mini-card">
              <div class="mini-card-head">门店订货上报</div>
              <div class="mini-card-body">选择门店、品项和数量，提交后自动汇总到采购后台。</div>
            </div>
            <div class="link-button">打开上报表</div>
          </div>
        </div>
        <div class="reply">金融街店：已提交</div>
        <div class="reply">朝阳店：收到，马上报</div>
        <div class="reply">望京店：今天蔬菜多一点</div>
        <div class="message-row">
          <div class="avatar">采</div>
          <div class="bubble">
            <strong>系统提醒</strong>
            还有 2 家门店未提交：国贸店、三里屯店。距离截止还有 25 分钟。
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
