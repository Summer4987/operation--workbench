<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>销售单据生成器</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="editor" aria-label="销售单据信息">
      <div class="editor-head">
        <div>
          <p class="eyebrow">成都熊小小餐饮管理有限公司</p>
          <h1>销售单据生成器</h1>
        </div>
        <button class="secondary-btn" id="clearForm" type="button">新建单据</button>
      </div>

      <form id="receiptForm">
        <div class="field-grid">
          <label class="field">
            <span>销售时间</span>
            <input id="saleDate" name="saleDate" type="date" required>
          </label>
          <label class="field">
            <span>单据编号</span>
            <input id="receiptNo" name="receiptNo" type="text" autocomplete="off">
          </label>
        </div>

        <label class="field">
          <span>收货单位</span>
          <input id="buyerName" name="buyerName" type="text" placeholder="填写收货单位名称" autocomplete="organization" required>
        </label>

        <div class="items-head">
          <h2>销售项目</h2>
          <button class="secondary-btn" id="addItem" type="button">添加一行</button>
        </div>

        <div class="item-table" id="itemTable" aria-label="销售项目明细">
          <div class="item-row item-row-head">
            <span>项目</span>
            <span>数量</span>
            <span>单位</span>
            <span>金额</span>
            <span></span>
          </div>
          <div id="itemRows"></div>
        </div>

        <label class="field">
          <span>备注</span>
          <textarea id="notes" name="notes" rows="3" placeholder="可填写送货说明、结算说明等"></textarea>
        </label>

        <div class="field seal-field">
          <span>销售单位印章</span>
          <div class="seal-controls">
            <input id="sealImage" name="sealImage" type="file" accept="image/*">
            <button class="secondary-btn" id="clearSeal" type="button">移除印章</button>
          </div>
        </div>

        <div class="actions">
          <button class="primary-btn" type="button" id="printReceipt">打印 / 保存 PDF</button>
        </div>
      </form>
    </section>

    <section class="preview-wrap" aria-label="销售单据预览">
      <article class="receipt" id="receipt">
        <header class="receipt-title">
          <h2>销售单据</h2>
          <p>单据编号：<span data-out="receiptNo"></span></p>
        </header>

        <div class="receipt-meta">
          <div>
            <span>销售单位</span>
            <strong>成都熊小小餐饮管理有限公司</strong>
          </div>
          <div>
            <span>收货单位</span>
            <strong data-out="buyerName">待填写</strong>
          </div>
          <div>
            <span>销售时间</span>
            <strong data-out="saleDate"></strong>
          </div>
        </div>

        <table class="receipt-table">
          <thead>
            <tr>
              <th>序号</th>
              <th>销售项目</th>
              <th>销售数量</th>
              <th>单位</th>
              <th>金额</th>
            </tr>
          </thead>
          <tbody id="receiptBody"></tbody>
          <tfoot>
            <tr>
              <td colspan="4">合计金额</td>
              <td id="receiptTotal">未填写</td>
            </tr>
          </tfoot>
        </table>

        <div class="receipt-note">
          <span>备注</span>
          <p data-out="notes">无</p>
        </div>

        <footer class="signature-row">
          <div class="signature-box">
            <img class="seal-image" id="salesSealPreview" alt="销售单位印章">
            <span>销售单位盖章 / 签字：</span>
          </div>
          <div class="signature-box">
            <span>收货单位盖章 / 签字：</span>
          </div>
        </footer>
      </article>
    </section>
  </main>

  <template id="itemRowTemplate">
    <div class="item-row">
      <input class="item-name" type="text" placeholder="例如：牛排饭套餐" autocomplete="off">
      <input class="item-qty" type="number" min="0" step="1" placeholder="数量">
      <input class="item-unit" type="text" placeholder="单位" autocomplete="off">
      <input class="item-amount" type="number" min="0" step="0.01" placeholder="可不填">
      <button class="icon-btn remove-item" type="button" aria-label="删除这一行">×</button>
    </div>
  </template>

  <script src="./app.js"></script>
</body>
</html>
