<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>熊小小数据中心</title>
    <link rel="stylesheet" href="./styles.css?v=20260625-franchise-data-center" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="熊小小数据中心导航">
        <a class="brand" href="#realtime" aria-label="熊小小数据中心首页">
          <span class="brand-mark">熊</span>
          <span>
            <strong>熊小小数据中心</strong>
            <em>加盟商查看端</em>
          </span>
        </a>
        <nav class="nav">
          <a class="active" href="#realtime">实时数据看板</a>
          <a href="#daily">日报看板</a>
          <a href="#reviews">评价看板</a>
        </nav>
        <div class="sidebar-status">
          <span>数据更新时间</span>
          <strong id="sidebarGeneratedAt">读取中</strong>
        </div>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <p id="generatedAt">等待数据同步</p>
            <h1>熊小小数据中心</h1>
          </div>
          <a class="open-main" href="../index.html">返回 AI 管理系统</a>
        </header>

        <section class="dashboard-grid" id="realtime" aria-labelledby="realtimeTitle">
          <article class="panel hero-panel">
            <div class="panel-head">
              <div>
                <p>加盟店实时数据看板</p>
                <h2 id="realtimeTitle">今日实时订单与营业额</h2>
              </div>
              <span class="status-pill" id="realtimeStatus">读取中</span>
            </div>
            <div class="metric-grid">
              <div>
                <span>当前单量</span>
                <strong id="realtimeOrders">-</strong>
              </div>
              <div>
                <span>当前营业额</span>
                <strong id="realtimeIncome">-</strong>
              </div>
              <div>
                <span>平台覆盖</span>
                <strong id="realtimeCoverage">-</strong>
              </div>
            </div>
            <p class="panel-note" id="realtimeMeta">等待实时数据。</p>
          </article>

          <article class="panel brief-panel">
            <div class="panel-head">
              <div>
                <p>昨日日报简报</p>
                <h2>经营快照</h2>
              </div>
              <span class="status-pill muted">日报</span>
            </div>
            <div class="brief-list">
              <div>
                <span>总单量</span>
                <strong id="dailyOrders">-</strong>
                <em id="dailyOrdersCompare">较前日 -</em>
              </div>
              <div>
                <span>总营业额</span>
                <strong id="dailyIncome">-</strong>
                <em id="dailyIncomeCompare">较前日 -</em>
              </div>
            </div>
            <p class="panel-note" id="dailySummary">等待日报数据。</p>
          </article>
        </section>

        <section class="panel store-panel" aria-labelledby="storeTitle">
          <div class="panel-head">
            <div>
              <p>门店实时排行</p>
              <h2 id="storeTitle">加盟店分店数据</h2>
            </div>
            <span class="status-pill muted" id="storeCount">-</span>
          </div>
          <div class="store-grid" id="realtimeStoreRows"></div>
        </section>

        <section class="section-block" id="daily" aria-labelledby="dailyTitle">
          <div class="section-head">
            <p>加盟店日报看板</p>
            <h2 id="dailyTitle">完整经营日报</h2>
          </div>
          <iframe
            class="report-frame"
            data-report-src="../business-report-dashboard/"
            data-local-report-src="../business-report-dashboard/dashboard/"
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
            title="加盟店日报看板"
          ></iframe>
        </section>

        <section class="section-block" id="reviews" aria-labelledby="reviewsTitle">
          <div class="section-head">
            <p>加盟店评价看板</p>
            <h2 id="reviewsTitle">评价、差评与门店问题</h2>
          </div>
          <article class="panel review-panel">
            <div class="panel-head">
              <div>
                <p>昨日评价</p>
                <h2>评价概览</h2>
              </div>
              <span class="status-pill" id="reviewStatus">读取中</span>
            </div>
            <div class="review-summary">
              <strong id="reviewCount">-</strong>
              <p id="reviewSummary">等待评价数据。</p>
            </div>
            <div class="command-grid" id="reviewCommandRows"></div>
            <div class="table-list" id="reviewWeeklyRows"></div>
            <div class="table-list" id="reviewRows"></div>
          </article>
        </section>
      </section>
    </main>

    <script src="../workbench-data.js?v=20260625-franchise-data-center"></script>
    <script src="./app.js?v=20260625-franchise-data-center"></script>
  </body>
</html>
