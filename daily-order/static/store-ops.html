<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>熊小小门店订货系统</title>
    <style>
      :root {
        color-scheme: light;
        --bar: #ffffff;
        --line: #dce4ed;
        --ink: #17202a;
        --muted: #657386;
        --brand: #176b5f;
        --bg: #f4f6f8;
        --nav-height: 66px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        overflow: hidden;
      }

      .ops-shell {
        height: 100%;
        padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom));
      }

      .ops-panel {
        display: none;
        width: 100%;
        height: 100%;
      }

      .ops-panel.is-active {
        display: block;
      }

      .ops-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
      }

      .logistics-panel {
        min-height: 100%;
        padding: 20px 14px 88px;
        overflow: auto;
      }

      .logistics-inner {
        width: min(980px, 100%);
        margin: 0 auto;
      }

      .logistics-title {
        margin: 0 0 12px;
        font-size: 26px;
        letter-spacing: 0;
      }

      .logistics-heading {
        min-width: 0;
      }

      .logistics-updated-at {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.35;
      }

      .logistics-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .logistics-toolbar button,
      .copy-button,
      .picked-button,
      .restore-button,
      .logistics-filter button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        min-height: 34px;
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 900;
      }

      .logistics-filter {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      .logistics-filter button.is-active {
        border-color: #9fd5c8;
        background: #e8f7f2;
        color: #176556;
      }

      .logistics-list {
        display: grid;
        gap: 10px;
      }

      .logistics-card,
      .logistics-empty {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        padding: 14px;
      }

      .logistics-card {
        display: grid;
        gap: 10px;
      }

      .logistics-card header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .logistics-card strong,
      .logistics-empty strong {
        display: block;
        font-size: 18px;
      }

      .logistics-card small,
      .logistics-empty span {
        color: var(--muted);
        line-height: 1.5;
      }

      .logistics-status {
        border-radius: 999px;
        background: #edf5ff;
        color: #235c9f;
        padding: 4px 9px;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 900;
      }

      .logistics-status.pickup {
        background: #fff3d7;
        color: #8a5a00;
      }

      .logistics-status.picked {
        background: #edf0f2;
        color: #5b6670;
      }

      .pickup-code {
        border-radius: 8px;
        background: #fff8e6;
        border: 1px solid #f0d48a;
        padding: 10px;
      }

      .pickup-code span {
        display: block;
        color: #8a5a00;
        font-size: 12px;
        font-weight: 900;
      }

      .pickup-code b {
        display: block;
        margin-top: 2px;
        font-size: 24px;
        letter-spacing: 0;
      }

      .logistics-meta {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .logistics-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        min-height: calc(var(--nav-height) + env(safe-area-inset-bottom));
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 -10px 24px rgba(23, 32, 42, 0.08);
        gap: 6px;
      }

      .bottom-nav button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        font-weight: 900;
        min-width: 0;
        min-height: 52px;
        padding: 5px 4px;
        cursor: pointer;
      }

      .bottom-nav button svg {
        display: block;
        width: 22px;
        height: 22px;
        margin: 0 auto 3px;
        stroke: currentColor;
        stroke-width: 2.3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .bottom-nav button.is-active {
        background: #e9f4f1;
        color: var(--brand);
      }

      .bottom-nav button:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: -2px;
      }

      @media (min-width: 860px) {
        :root {
          --nav-height: 70px;
        }

        .bottom-nav {
          right: 50%;
          left: 50%;
          width: min(520px, calc(100% - 28px));
          transform: translateX(-50%);
          bottom: 10px;
          border: 1px solid var(--line);
          border-radius: 14px;
          padding: 7px;
          min-height: var(--nav-height);
        }
      }
    </style>
  </head>
  <body>
    <main class="ops-shell">
      <section id="dailyPanel" class="ops-panel is-active" aria-label="日常订货">
        <iframe class="ops-frame" src="/daily-order/?ui=20260701-compact-actions" title="熊小小成都门店订货"></iframe>
      </section>

      <section id="supplyPanel" class="ops-panel" aria-label="日配">
        <iframe id="supplyFrame" class="ops-frame" src="/order-submit?token=xiongxiaoxiao-order&ui=20260701-compact-actions" title="熊小小日配订货"></iframe>
      </section>

      <section id="logisticsPanel" class="ops-panel logistics-panel" aria-label="物流信息">
        <div class="logistics-inner">
          <div class="logistics-toolbar">
            <div class="logistics-heading">
              <h1 class="logistics-title">物流信息</h1>
              <span id="logisticsUpdatedAt" class="logistics-updated-at">最新刷新：读取中</span>
            </div>
            <button id="refreshLogisticsButton" type="button">刷新</button>
          </div>
          <div class="logistics-filter" aria-label="物流状态筛选">
            <button class="is-active" type="button" data-logistics-filter="pickup">待取件</button>
            <button type="button" data-logistics-filter="transit">运输中</button>
            <button type="button" data-logistics-filter="picked">已取件</button>
          </div>
          <div id="logisticsList" class="logistics-list">
            <div class="logistics-empty">
              <strong>正在读取物流记录</strong>
              <span>快递单号、物流状态和取件码会在这里展示。</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="门店订货菜单">
      <button class="is-active" type="button" data-target="dailyPanel" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16" />
          <path d="M4 12h16" />
          <path d="M4 18h10" />
        </svg>
        日常订货
      </button>
      <button type="button" data-target="supplyPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 7h13v10H3z" />
          <path d="M16 10h3l2 3v4h-5z" />
          <circle cx="7" cy="19" r="2" />
          <circle cx="18" cy="19" r="2" />
        </svg>
        日配
      </button>
      <button type="button" data-target="logisticsPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3h9l3 3v15H6z" />
          <path d="M15 3v4h4" />
          <path d="M9 12h6" />
          <path d="M9 16h4" />
        </svg>
        物流信息
      </button>
    </nav>

    <script>
      const buttons = Array.from(document.querySelectorAll(".bottom-nav button"));
      const panels = Array.from(document.querySelectorAll(".ops-panel"));
      const supplyFrame = document.querySelector("#supplyFrame");
      const logisticsList = document.querySelector("#logisticsList");
      const logisticsUpdatedAt = document.querySelector("#logisticsUpdatedAt");
      const refreshLogisticsButton = document.querySelector("#refreshLogisticsButton");
      const logisticsFilterButtons = Array.from(document.querySelectorAll("[data-logistics-filter]"));
      let logisticsLoaded = false;
      let logisticsItems = [];
      let logisticsFilter = "pickup";

      const isLocalHost = ["127.0.0.1", "localhost", "::1"].includes(window.location.hostname);
      if (supplyFrame && isLocalHost && window.location.port && window.location.port !== "8000") {
        supplyFrame.src = `${window.location.protocol}//${window.location.hostname}:8000/order-submit?token=xiongxiaoxiao-order&ui=20260701-compact-actions`;
      }

      function activatePanel(targetId) {
        panels.forEach((panel) => panel.classList.toggle("is-active", panel.id === targetId));
        buttons.forEach((button) => {
          const isActive = button.dataset.target === targetId;
          button.classList.toggle("is-active", isActive);
          if (isActive) {
            button.setAttribute("aria-current", "page");
          } else {
            button.removeAttribute("aria-current");
          }
        });
        if (targetId === "logisticsPanel" && !logisticsLoaded) loadLogistics();
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => activatePanel(button.dataset.target));
      });

      refreshLogisticsButton.addEventListener("click", () => loadLogistics(true));
      logisticsFilterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          logisticsFilter = button.dataset.logisticsFilter;
          logisticsFilterButtons.forEach((item) => item.classList.toggle("is-active", item === button));
          renderLogistics(logisticsItems);
        });
      });

      async function loadLogistics(force = false) {
        if (!force && logisticsLoaded) return;
        updateLogisticsTimestamp([]);
        logisticsList.innerHTML = emptyLogistics("正在读取物流记录", "快递单号、物流状态和取件码会在这里展示。");
        try {
          const response = await fetch("/daily-order/api/logistics");
          if (response.status === 401) {
            location.href = "/store-ops/";
            return;
          }
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || "物流记录读取失败");
          logisticsLoaded = true;
          logisticsItems = payload.items || [];
          updateLogisticsTimestamp(logisticsItems);
          renderLogistics(logisticsItems);
        } catch (error) {
          if (logisticsUpdatedAt) logisticsUpdatedAt.textContent = "最新刷新：读取失败";
          logisticsList.innerHTML = emptyLogistics("物流记录读取失败", error.message || "请稍后重试。");
        }
      }

      function renderLogistics(items) {
        const visibleItems = items.filter((item) => logisticsCategory(item) === logisticsFilter);
        if (!visibleItems.length) {
          logisticsList.innerHTML = emptyLogistics(...emptyLogisticsCopy(logisticsFilter));
          return;
        }
        logisticsList.innerHTML = visibleItems.map((item) => {
          const pickup = item.pickup_code || "";
          const category = logisticsCategory(item);
          const statusClass = category === "picked" ? " picked" : category === "pickup" ? " pickup" : "";
          const copyText = [
            item.store_name ? `门店：${item.store_name}` : "",
            item.goods ? `货品：${item.goods}` : "",
            item.carrier ? `快递：${item.carrier}` : "",
            item.tracking_number ? `单号：${item.tracking_number}` : "",
            pickup ? `取件码：${pickup}` : "",
            item.latest_trace ? `状态：${item.latest_trace}` : item.status ? `状态：${item.status}` : "",
          ].filter(Boolean).join("\\n");
          const statusText = category === "picked" ? "已取件" : category === "pickup" ? "待取件" : "运输中";
          const copyButtonText = category === "pickup" ? "复制取件信息" : "复制物流信息";
          return `
            <article class="logistics-card">
              <header>
                <div>
                  <strong>${escapeHtml(item.goods || item.supplier || item.tracking_number || "门店快递")}</strong>
                  <small>${escapeHtml(item.store_name || "")}${item.supplier ? ` · ${escapeHtml(item.supplier)}` : ""}</small>
                </div>
                <span class="logistics-status${statusClass}">${escapeHtml(statusText)}</span>
              </header>
              ${pickup ? `<div class="pickup-code"><span>取件码</span><b>${escapeHtml(pickup)}</b></div>` : ""}
              <div class="logistics-meta">
                ${item.goods ? `<div>商品：${escapeHtml(item.goods)}</div>` : ""}
                ${item.carrier || item.tracking_number ? `<div>快递：${escapeHtml([item.carrier, item.tracking_number].filter(Boolean).join(" · "))}</div>` : ""}
                ${item.latest_trace ? `<div>轨迹：${escapeHtml(item.latest_trace)}</div>` : ""}
                ${item.eta ? `<div>预计到达：${escapeHtml(item.eta)}</div>` : ""}
                ${item.updated_at ? `<div>更新：${escapeHtml(item.updated_at)}</div>` : ""}
                ${item.picked_up_at ? `<div>取件：${escapeHtml(item.picked_up_at)}</div>` : ""}
              </div>
              <div class="logistics-actions">
                <button class="copy-button" type="button" data-copy="${escapeHtml(copyText)}" data-label="${escapeHtml(copyButtonText)}">${escapeHtml(copyButtonText)}</button>
                ${category === "picked"
                  ? `<button class="restore-button" type="button" data-id="${escapeHtml(item.id)}">恢复未取</button>`
                  : category === "pickup"
                    ? `<button class="picked-button" type="button" data-id="${escapeHtml(item.id)}">已取件</button>`
                    : ""}
              </div>
            </article>
          `;
        }).join("");
        logisticsList.querySelectorAll(".copy-button").forEach((button) => {
          button.addEventListener("click", async () => {
            await navigator.clipboard.writeText(button.dataset.copy || "");
            button.textContent = "已复制";
            setTimeout(() => { button.textContent = button.dataset.label || "复制物流信息"; }, 1200);
          });
        });
        logisticsList.querySelectorAll(".picked-button, .restore-button").forEach((button) => {
          button.addEventListener("click", async () => {
            const picked = button.classList.contains("picked-button");
            await updatePicked(button.dataset.id, picked);
          });
        });
      }

      async function updatePicked(id, picked) {
        const response = await fetch(`/daily-order/api/logistics/${encodeURIComponent(id)}/picked`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ picked }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || "物流状态更新失败");
        const index = logisticsItems.findIndex((item) => item.id === id);
        if (index >= 0) logisticsItems[index] = payload.item;
        renderLogistics(logisticsItems);
      }

      function logisticsCategory(item) {
        if (item.picked_up) return "picked";
        if (item.pickup_code) return "pickup";
        return "transit";
      }

      function updateLogisticsTimestamp(items) {
        if (!logisticsUpdatedAt) return;
        if (!items.length) {
          logisticsUpdatedAt.textContent = "最新刷新：暂无数据";
          return;
        }
        const latest = items
          .map((item) => item.updated_at || item.captured_at || item.picked_up_at || "")
          .filter(Boolean)
          .sort((left, right) => new Date(right).getTime() - new Date(left).getTime())[0] || "";
        logisticsUpdatedAt.textContent = latest ? `最新刷新：${formatLogisticsTime(latest)}` : "最新刷新：暂无时间";
      }

      function formatLogisticsTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function emptyLogisticsCopy(filter) {
        if (filter === "picked") return ["暂无已取件记录", "点过已取件的快递会留在这里，方便误触后查询。"];
        if (filter === "transit") return ["暂无运输中记录", "有物流信息但还没有取件码的快递会在这里显示。"];
        return ["暂无待取件记录", "出现取件码后会自动进入这里，门店取完再点已取件。"];
      }

      function emptyLogistics(title, text) {
        return `<div class="logistics-empty"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(text)}</span></div>`;
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]));
      }
    </script>
  </body>
</html>
