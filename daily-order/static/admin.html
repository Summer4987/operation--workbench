<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>日常订货处理看板</title>
    <link rel="stylesheet" href="/daily-order/static/styles.css?v=20260614-lock-zoom" />
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <header class="admin-topbar">
        <div>
          <span>熊小小订货后台</span>
          <h1>订单处理看板</h1>
        </div>
        <button id="notifyButton" type="button">开启提醒</button>
      </header>

      <section class="admin-stats">
        <div><span>未处理</span><strong id="pendingCount">0</strong></div>
        <div><span>当前订单</span><strong id="orderCount">0</strong></div>
        <div><span>SKU 行数</span><strong id="lineCount">0</strong></div>
      </section>

      <nav class="admin-tabs" aria-label="订单状态">
        <button class="active" type="button" data-status="pending">未处理</button>
        <button type="button" data-status="processed">已处理</button>
        <button type="button" data-status="all">全部</button>
      </nav>

      <section id="adminMessage" class="admin-message"></section>
      <section id="channelBoard" class="channel-board"></section>
    </main>
    <script src="/daily-order/static/admin.js?v=20260614-lock-zoom"></script>
  </body>
</html>
