<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>熊小小成都门店订货</title>
    <link rel="stylesheet" href="/daily-order/static/styles.css?v=20260623-store-title" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <span>熊小小订货</span>
          <h1>熊小小成都门店订货</h1>
        </div>
      </header>

      <section class="store-panel">
        <div class="store-field">
          <label for="storeName">门店名称</label>
          <select id="storeName" required>
            <option value="">请选择门店</option>
          </select>
        </div>
        <div class="store-actions">
          <button id="toggleOrdersButton" type="button" aria-expanded="false">查看已下单订单</button>
        </div>
        <div id="storeOrdersPanel" class="store-orders-panel">
          <div class="store-orders-toolbar">
            <strong>已下单订单</strong>
            <button id="refreshOrdersButton" type="button">刷新</button>
          </div>
          <div id="storeOrdersList" class="store-orders-list">
            <p>选择门店后可查看最近提交的订单。</p>
          </div>
        </div>
      </section>

      <section class="filters">
        <input id="searchInput" type="search" placeholder="搜索品名 / SKU / 备注" />
        <div id="sourceTabs" class="tabs" role="tablist"></div>
      </section>

      <section id="catalogGrid" class="catalog-grid" aria-label="日常订货 SKU"></section>
    </main>

    <aside class="submit-bar">
      <div class="submit-inner">
        <div>
          <strong id="summaryText">还没有选择 SKU</strong>
          <span id="summaryDetail">填写数量后提交</span>
        </div>
        <button id="submitButton" type="button" disabled>提交订单</button>
      </div>
    </aside>

    <dialog id="confirmDialog" tabindex="-1">
      <form method="dialog" class="dialog-card">
        <h2>确认订货</h2>
        <div id="confirmStore" class="confirm-store"></div>
        <div id="confirmList" class="confirm-list"></div>
        <label>
          备注
          <textarea id="remark" placeholder="可选，例如希望到货时间或特殊说明"></textarea>
        </label>
        <div id="message" class="message"></div>
        <div class="dialog-actions">
          <button class="ghost-button" value="cancel" type="submit">返回修改</button>
          <button id="confirmSubmitButton" value="default" type="button">确认提交</button>
        </div>
      </form>
    </dialog>

    <section id="successScreen" class="success-screen">
      <div class="success-card">
        <span>提交成功</span>
        <h2 id="successOrderId">订单已记录</h2>
        <p>我们已经收到这次日常订货明细。</p>
        <button id="newOrderButton" type="button">继续下一单</button>
      </div>
    </section>

    <script src="/daily-order/static/app.js?v=20260623-no-minimum"></script>
  </body>
</html>
