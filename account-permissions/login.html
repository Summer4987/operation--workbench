<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>熊小小业务中心登录</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f3f5f8;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#172033;padding:20px}main{width:100%;max-width:420px;background:#fff;padding:32px;border:1px solid #e2e8f0;border-radius:12px}h1{font-size:24px;margin:0}p{color:#64748b;font-size:14px}label{display:block;margin-top:18px}input,button{font:inherit;width:100%;padding:12px;border-radius:7px;border:1px solid #cbd5e1;margin-top:6px}button{background:#0f766e;color:white;border:0;cursor:pointer;margin-top:24px}#error{color:#b91c1c}button:disabled{opacity:.5}</style><main><h1>🐻 熊小小业务中心</h1><p>使用个人账号登录，访问已授权的功能和门店。</p><form id="login"><label>用户名<input name="username" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><p id="error" role="alert"></p><button>登录</button></form></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const form=e.target,button=form.querySelector('button');button.disabled=true;document.querySelector('#error').textContent='';try{const fields=new FormData(form);const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:fields.get('username'),password:fields.get('password')})});const data=await r.json();if(!r.ok)throw new Error(data.detail||'登录失败');let next=data.next||'/operation-workbench/';const requested=new URLSearchParams(location.search).get('next');if(next==='/operation-workbench/'&&requested?.startsWith('/')){const destination=new URL(requested,location.origin);if(destination.origin===location.origin)next=destination.pathname+destination.search+destination.hash;}location.assign(next)}catch(error){document.querySelector('#error').textContent=error.message;button.disabled=false}});</script></html>
