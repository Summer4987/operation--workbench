<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>个人工作台 · 熊小小</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./member.js?v=20261120-messages"></script><style>.sidebar{overflow:auto}.module-link{display:block;padding:10px;margin:3px 0;border-radius:6px;color:#cbd5e1}.module-link.active{background:#23423f;color:#fff}.data-panel{padding:24px;margin-top:20px}.data-panel h2{margin-bottom:12px}.summary-line{display:flex;gap:25px;flex-wrap:wrap;margin:15px 0}.request-row{padding:16px 0;border-top:1px solid #e2e8f0}.request-row p{white-space:pre-wrap}.request-row .buttons{margin-top:10px}textarea{font:inherit;width:100%;min-height:100px;padding:12px;border:1px solid #cbd5e1;border-radius:6px}#toolLink{display:inline-block;background:#0f766e;color:white;border-radius:6px;padding:10px 16px}#moduleNav{margin:16px 0}#me{color:#cbd5e1;font-size:14px}.question{display:flex;gap:10px}.question button{white-space:nowrap}.scope-note{font-size:14px;color:#64748b}@media(max-width:760px){.sidebar{display:block}.sidebar .brand{margin-bottom:12px}#moduleNav{display:flex;overflow:auto}.module-link{white-space:nowrap}.data-panel{padding:16px}}</style></head><body><aside class="sidebar"><a class="brand" href="./member.html"><span class="bear">🐻</span><strong>个人工作台</strong></a><p id="me"></p><nav id="moduleNav" aria-label="已授权功能"></nav><a id="adminLink" href="./" class="module-link" hidden>账号与权限</a><button id="logout">退出登录</button></aside><main><header class="page-head"><div><p class="eyebrow">熊小小 AI 管理系统</p><h1 id="moduleTitle">正在读取权限</h1><p id="scope" class="muted"></p></div><span class="draft-badge">后台权限已启用</span></header><div id="error" class="error" role="alert" hidden></div><iframe id="messagesFrame" title="直营门店消息复盘" sandbox="allow-same-origin" style="width:100%;height:75vh;border:0" hidden></iframe><section id="dataPanel" class="panel data-panel"><div class="panel-head"><h2>授权门店数据</h2><div class="buttons"><button id="refresh">刷新数据</button><a id="export" hidden>导出本范围 CSV</a></div></div><p id="updated" class="muted"></p><div id="summary" class="summary-line"></div><div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><p id="empty" class="muted" hidden>当前没有可展示的门店记录。缺少数据不代表当天为零。</p><p class="scope-note">所有汇总均由后台基于授权门店重算。库存模块展示授权门店的货流记录。</p><a id="toolLink" target="_blank" rel="noopener" hidden>打开工具</a></section><section class="panel data-panel"><h2>本范围数据问答</h2><p class="muted">仅基于当前功能、授权门店的数据回答，不连接全量 Agent。</p><div class="question"><input id="question" placeholder="汇总当前授权范围的数据" aria-label="数据问题"><button id="ask">查看汇总回答</button></div><p id="answer"></p></section><section class="panel data-panel"><h2>变更申请与审批</h2><p class="muted">修改权限用于提交变更申请；审批权限用于处理申请。审批通过不等于平台已执行，预算、出价、订货等仍须总管理员正式执行。</p><form id="requestForm" hidden><label>目标门店<select id="requestStore"></select></label><label>申请内容<textarea id="requestBody" maxlength="2000" required placeholder="填写需要修改的内容、原因和目标值"></textarea></label><button class="primary">提交申请</button></form><div id="requests"></div></section></main></body></html>
